# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Cloudinary sera utilisé pour le stockage des médias
    app.access_token_ttl: 'PT15M'
    app.refresh_token_ttl: 'P30D'
    mvola.environment: '%env(MVOLA_ENVIRONMENT)%'
    mvola.consumer_key: '%env(MVOLA_CONSUMER_KEY)%'
    mvola.consumer_secret: '%env(MVOLA_CONSUMER_SECRET)%'
    mvola.api_base_url: '%env(MVOLA_API_BASE_URL)%'
    mvola.token_url: '%env(MVOLA_TOKEN_URL)%'
    mvola.auth_url: '%env(MVOLA_AUTH_URL)%'
    mvola.merchant_msisdn: '%env(MVOLA_MERCHANT_MSISDN)%'
    mvola.merchant_name: '%env(MVOLA_MERCHANT_NAME)%'
    mvola.merchant_account_id: '%env(MVOLA_MERCHANT_ACCOUNT_ID)%'
    mvola.callback_url: '%env(MVOLA_CALLBACK_URL)%'
    mvola.notification_url: '%env(MVOLA_NOTIFICATION_URL)%'
    mvola.request_timeout: '%env(int:MVOLA_REQUEST_TIMEOUT)%'
    mvola.connection_timeout: '%env(int:MVOLA_CONNECTION_TIMEOUT)%'


services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'


    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Service\TokenService:
        arguments:
            $secret: '%env(APP_SECRET)%'
            $accessTokenTtl: '%app.access_token_ttl%'
            $refreshTokenTtl: '%app.refresh_token_ttl%'

    App\Service\QrCodeService:
        arguments:
            $publicPath: '%kernel.project_dir%/public'

    App\Service\Organisateur\EventPdfExportService:
        arguments:
            $projectDir: '%kernel.project_dir%'
    
    App\Service\Organisateur\MvolaService:
        arguments:
            $httpClient: '@http_client'
            $logger: '@logger'
            $environment: '%env(MVOLA_ENVIRONMENT)%'
            $consumerKey: '%env(MVOLA_CONSUMER_KEY)%'
            $consumerSecret: '%env(MVOLA_CONSUMER_SECRET)%'
            $apiBaseUrl: '%env(MVOLA_API_BASE_URL)%'
            $tokenUrl: '%env(MVOLA_TOKEN_URL)%'
            $merchantMsisdn: '%env(MVOLA_MERCHANT_MSISDN)%'
            $merchantName: '%env(MVOLA_MERCHANT_NAME)%'
            $merchantAccountId: '%env(MVOLA_MERCHANT_ACCOUNT_ID)%'
            $callbackUrl: '%env(MVOLA_CALLBACK_URL)%'
            $notificationUrl: '%env(MVOLA_NOTIFICATION_URL)%'
            $requestTimeout: '%env(int:MVOLA_REQUEST_TIMEOUT)%'
            $connectionTimeout: '%env(int:MVOLA_CONNECTION_TIMEOUT)%'

