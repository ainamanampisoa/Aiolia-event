security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: bcrypt
            cost: 13

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        
        api:
            pattern: ^/api/
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\BearerTokenAuthenticator
            user_checker: App\Security\UserStatusChecker

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserStatusChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                success_handler: App\Security\AuthenticationSuccessHandler
                failure_handler: App\Security\AuthenticationFailureHandler
                username_parameter: identifier
                password_parameter: password
            logout:
                path: app_logout
                target: app_login
                invalidate_session: true
                delete_cookies:
                    - REMEMBERME
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # Routes d'authentification
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/refresh$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/mvola, roles: PUBLIC_ACCESS }
        
        # Routes de test MVola (accès public)
        - { path: ^/api/mvola/test/connection$, roles: PUBLIC_ACCESS }
        - { path: ^/api/mvola/test/env$, roles: PUBLIC_ACCESS }
        - { path: ^/api/mvola/test/payment$, roles: PUBLIC_ACCESS }
        - { path: ^/api/mvola/test/status/, roles: PUBLIC_ACCESS }
        - { path: ^/api/mvola/test/details/, roles: PUBLIC_ACCESS }
        - { path: ^/api/mvola/test/full-flow$, roles: PUBLIC_ACCESS }
        - { path: ^/api/mvola/test/debug-headers$, roles: PUBLIC_ACCESS }
        - { path: ^/api/mvola/test/payment-with-retry$, roles: PUBLIC_ACCESS }
        - { path: ^/api/mvola/test/verify-4002/, roles: PUBLIC_ACCESS }
        - { path: ^/api/mvola/callback$, roles: PUBLIC_ACCESS }
        
        # Toutes les autres routes API nécessitent une authentification
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }

        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon