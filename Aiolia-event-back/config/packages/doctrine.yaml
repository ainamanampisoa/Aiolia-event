doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            datetimetz: App\Doctrine\Type\DateTimeTzMicrosecondsType
        mapping_types:
            user_role_enum: string
            user_status_enum: string
            auth_provider_enum: string
            event_status_enum: string
            event_visibility_enum: string
            ticket_status_enum: string
            ticket_transfer_status_enum: string
            order_status_enum: string
            payment_status_enum: string
            notification_channel_enum: string
            notification_status_enum: string
            promotion_type_enum: string
            pricing_rule_type_enum: string
            wallet_transaction_type_enum: string
            wallet_transaction_status_enum: string
            referral_reward_type_enum: string
            invite_status_enum: string
            subscription_status_enum: string
            cart_status_enum: string
            ticket_chance_status_enum: string
            organizer_type_enum: string
            citext: string
            _text: text
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
