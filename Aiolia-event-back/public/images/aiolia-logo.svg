<svg width="350" height="80" viewBox="0 0 350 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .aiolia-text { 
        font-family: 'Arial Black', Arial, sans-serif; 
        font-weight: 900; 
        font-size: 40px; 
        fill: #4A5568; 
        text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        letter-spacing: 1px;
      }
      .dash-text { 
        font-family: 'Arial Black', Arial, sans-serif; 
        font-weight: 900; 
        font-size: 40px; 
        fill: #718096; 
        text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
      }
      .event-text { 
        font-family: 'Arial Black', Arial, sans-serif; 
        font-weight: 900; 
        font-size: 40px; 
        fill: #D0C9B0; 
        text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        letter-spacing: 1px;
      }
    </style>
  </defs>
  
  <!-- Aiolia text -->
  <text x="20" y="55" class="aiolia-text">AIOLIA</text>
  
  <!-- Dash -->
  <text x="165" y="55" class="dash-text">-</text>
  
  <!-- Event text -->
  <text x="185" y="55" class="event-text">EVENT</text>
</svg>
