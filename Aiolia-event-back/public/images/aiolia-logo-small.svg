<svg width="200" height="50" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .aiolia-text { 
        font-family: 'Arial Black', Arial, sans-serif; 
        font-weight: 900; 
        font-size: 22px; 
        fill: #4A5568; 
        text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        letter-spacing: 0.5px;
      }
      .dash-text { 
        font-family: 'Arial Black', Arial, sans-serif; 
        font-weight: 900; 
        font-size: 22px; 
        fill: #718096; 
        text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
      }
      .event-text { 
        font-family: 'Arial Black', Arial, sans-serif; 
        font-weight: 900; 
        font-size: 22px; 
        fill: #D0C9B0; 
        text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        letter-spacing: 0.5px;
      }
    </style>
  </defs>
  
  <!-- Aiolia text -->
  <text x="20" y="32" class="aiolia-text">AIOLIA</text>
  
  <!-- Dash -->
  <text x="108" y="32" class="dash-text">-</text>
  
  <!-- Event text -->
  <text x="118" y="32" class="event-text">EVENT</text>
</svg>
