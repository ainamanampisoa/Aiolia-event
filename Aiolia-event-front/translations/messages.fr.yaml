# À propos
about:
  page_title: "À propos - Aiolia-event"
  title: "À propos"
  description: "<strong>Aiolia-event</strong> est une plateforme malgache dédiée à la promotion, à la gestion et à la vente de billets pour tous types d'événements : concerts, festivals, conférences, expositions, soirées, et bien plus encore. Nous connectons les organisateurs et le public à travers une solution simple, rapide et sécurisée."
  description_2: "Que vous soyez <strong>organisateur</strong> souhaitant promouvoir votre événement, ou <strong>participant</strong> à la recherche d'activités culturelles et festives, <strong>Aiolia-event</strong> vous facilite la vie. Publiez, découvrez, réservez et profitez d'une expérience fluide, où que vous soyez à Madagascar."
  mission_title: "Notre mission"
  mission_text: "Chez <strong>Aiolia-event</strong>, nous croyons au dynamisme et au potentiel de la scène culturelle et événementielle malgache. Notre mission est de soutenir les organisateurs locaux en leur offrant des outils accessibles et performants, tout en permettant au public de vivre pleinement chaque événement. Ensemble, faisons rayonner la créativité et la culture à Madagascar."
