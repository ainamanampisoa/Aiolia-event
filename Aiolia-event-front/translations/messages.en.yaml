# About
about:
  page_title: "About - Aiolia-event"
  title: "About"
  description: "<strong>Aiolia-event</strong> is a Malagasy platform dedicated to promoting, managing and selling tickets for all types of events: concerts, festivals, conferences, exhibitions, parties, and much more. We connect organizers and the public through a simple, fast and secure solution."
  description_2: "Whether you are an <strong>organizer</strong> wanting to promote your event, or a <strong>participant</strong> looking for cultural and festive activities, <strong>Aiolia-event</strong> makes your life easier. Publish, discover, book and enjoy a smooth experience, wherever you are in Madagascar."
  mission_title: "Our mission"
  mission_text: "At <strong>Aiolia-event</strong>, we believe in the dynamism and potential of the Malagasy cultural and event scene. Our mission is to support local organizers by offering them accessible and efficient tools, while allowing the public to fully experience each event. Together, let's make creativity and culture shine in Madagascar."
