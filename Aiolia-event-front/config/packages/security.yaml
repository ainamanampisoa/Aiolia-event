security:
    password_hashers:
        App\Entity\User: 'auto'
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Firewall pour les notifications (désactivé - authentification manuelle par session)
        notifications:
            pattern: ^/api/notifications
            security: false

        # Firewall pour ticket-chance (authentification manuelle par session)
        ticket_chance:
            pattern: ^/api/ticket-chance
            security: false

        # Firewall pour les routes de tickets qui utilisent la session (panier, promo codes)
        # IMPORTANT: Doit être AVANT le firewall 'api' pour être prioritaire
        tickets_session:
            pattern: ^/api/tickets/(cart|promo)
            security: false

        # Firewall API (utilise JWT) - Doit être APRÈS les firewalls spécifiques
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/auth/(login|register|refresh)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout$, roles: ROLE_USER }
        - { path: ^/api/tickets/(cart|promo), roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
