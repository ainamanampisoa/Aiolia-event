framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        prefix_seed: aiolia_event_front

        # Redis cache adapter (utilise Predis comme client)
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

        # Pools de cache spécialisés
        pools:
            # Cache pour les événements populaires
            cache.events:
                adapter: cache.adapter.redis
                default_lifetime: 3600 # 1 heure
            
            # Cache pour les résultats de recherche
            cache.search:
                adapter: cache.adapter.redis
                default_lifetime: 1800 # 30 minutes
            
            # Cache pour les statistiques
            cache.stats:
                adapter: cache.adapter.redis
                default_lifetime: 1800 # 30 minutes
            
            # Cache pour les sessions (si utilisé)
            cache.sessions:
                adapter: cache.adapter.redis
                default_lifetime: 86400 # 24 heures
